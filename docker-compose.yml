services:
  frontend:
    container_name: frontend-web
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      strapi:
        condition: service_started

  strapi:
    container_name: strapi
    build: ./ITIDsite
    image: strapi:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./ITIDsite/config:/opt/app/config
      - ./ITIDsite/src:/opt/app/src
      - ./ITIDsite/package.json:/opt/package.json
      - ./ITIDsite/package-lock.json:/opt/package-lock.json
      - ./ITIDsite/.env:/opt/app/.env
      - ./ITIDsite/public:/opt/app/public
    ports:
      - "1338:1337"
    networks:
      - strapi
    depends_on:
      strapiDB:
        condition: service_healthy

  strapiDB:
    container_name: strapiDB
    restart: unless-stopped
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    networks:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  strapi-data:

networks:
  strapi:
    name: strapi
    driver: bridge